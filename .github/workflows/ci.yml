name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: server/go.sum

      - name: Verify modules are tidy
        working-directory: server
        run: |
          go mod tidy
          # go.mod / go.sum 有未提交的变更说明依赖没整理干净。
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod 或 go.sum 未整理，请在本地执行 go mod tidy 后提交"; exit 1; }

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        # -race 是必要的：dnsd 的查询路径大量依赖 atomic.Pointer 与分片锁，
        # 数据竞争只有竞态检测器能发现。
        run: go test -race -count=1 ./...

      - name: Build
        working-directory: server
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go build -o /tmp/aegis-dnsd ./cmd/dnsd
          CGO_ENABLED=0 go build -o /tmp/aegis-apid ./cmd/apid
          /tmp/aegis-dnsd -version
          /tmp/aegis-apid -version

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      - name: Type check
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Verify dist
        run: test -f web/dist/index.html && ls -la web/dist
