name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 从 go.mod 读版本，而不是写死：依赖（dnsproxy 等）会不断抬高
          # 最低 Go 版本要求，写死的数字迟早和 go.mod 不一致，
          # 表现为 CI 在 tidy 阶段报 "requires go >= 1.26.8"。
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify go.mod is tidy
        working-directory: server
        run: |
          cp go.mod /tmp/go.mod.before
          go mod tidy
          # 只比对 go.mod，不比对 go.sum。
          #
          # 原因：不同 Go 版本对 go.sum 的剪枝策略不一样（同一个仓库在 1.26 和
          # 1.27 上 tidy 出来的 go.sum 行数能差几十行），把 go.sum 纳入严格比对
          # 会让 CI 因为工具链小版本差异而无意义地变红。
          # go.sum 的完整性由后面的 `go build` 兜底：缺条目时 readonly 模式会直接报错。
          if ! diff -q /tmp/go.mod.before go.mod >/dev/null; then
            echo "::error::go.mod 未整理，请在本地执行 go mod tidy 后提交"
            diff -u /tmp/go.mod.before go.mod || true
            exit 1
          fi
          echo "go.mod 已整理"

      - name: gofmt
        working-directory: server
        # gofmt 只管格式、不改语义，但混在功能提交里会让 diff 失真，
        # 所以在 CI 里挡住，保证「格式」这件事永远不会成为提交内容的一部分。
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            echo "本地执行：cd server && gofmt -w ."
            exit 1
          fi

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: Test
        working-directory: server
        # -race 是必要的：dnsd 的查询路径大量依赖 atomic.Pointer 与分片锁，
        # 数据竞争只有竞态检测器能发现。
        run: go test -race -count=1 ./...

      - name: Build binaries
        working-directory: server
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go build -o /tmp/aegis-dnsd ./cmd/dnsd
          CGO_ENABLED=0 go build -o /tmp/aegis-apid ./cmd/apid
          /tmp/aegis-dnsd -version
          /tmp/aegis-apid -version

      - name: Verify embedded frontend
        run: |
          # 仓库里只有 webdist/dist/.gitkeep 占位，因此从源码编译出的 apid
          # 必须报告 frontend=false（说明占位路径生效、不会误以为带上了前端）。
          /tmp/aegis-apid -version

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 不写死版本：action 会读取 package.json 的 packageManager，
        # 保证 CI 与本地开发用的是同一个 pnpm。
        # 写死版本的代价是「本地用 pnpm 12、CI 用 pnpm 9」这类分歧 ——
        # 两者对 pnpm-workspace.yaml 里设置项的语义并不一致
        # （例如 onlyBuiltDependencies 在 11 起被 allowBuilds 取代且静默失效）。

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi

      - name: Type check
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: web
        run: pnpm build

      - name: Verify dist
        run: test -f web/dist/index.html && ls -la web/dist
