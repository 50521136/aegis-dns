<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 珍珠玻璃主色（浅 / 深两态取深色态，移动端地址栏跟随） -->
    <meta name="theme-color" content="#121517" />
    <meta name="description" content="DNSForge —— 多租户加密 DNS 服务管理面板，支持 DoT / DoH / 普通 DNS。" />
    <title>DNSForge 控制台</title>
    <script>
      // 在渲染前应用主题，避免闪烁（FOUC）
      // 同时写 class 与 data-theme：材质选择器读 data-theme，Tailwind 深色变体读 .dark
      ;(function () {
        try {
          var root = document.documentElement
          var t = localStorage.getItem('aegis-theme')
          var dark
          if (t === 'light') dark = false
          else if (t === 'dark') dark = true
          else dark = !window.matchMedia('(prefers-color-scheme: light)').matches
          root.classList.toggle('dark', dark)
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
